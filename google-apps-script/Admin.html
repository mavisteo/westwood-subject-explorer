<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style><?!= HtmlService.createHtmlOutputFromFile('Styles').getContent(); ?></style></head><body class="admin"><main><p class="eyebrow">WESTWOOD · STAFF DASHBOARD</p><h1 style="font-size:32px">Subject Explorer content</h1><p id="identity">Verifying your Google account…</p><div id="status" role="status"></div><div class="admin-grid"><nav class="admin-menu" id="menu" style="display:block;margin:0"></nav><section id="editor"></section></div></main><script>
let state,tab='subjects',selected=0,draft;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fail(e){$('status').textContent=e.message||String(e);document.querySelectorAll('button').forEach(b=>b.disabled=false);}
function loaded(s){state=s;draft=structuredClone(s.data);$('identity').textContent=s.actor.email+' · '+s.actor.role;$('status').textContent='Content loaded. Changes become visible to students after saving and refreshing their page.';render();}
function menu(){const tabs=['subjects','combinations','eligibility',...(state.actor.role==='Admin'?['admins','log']:[])];$('menu').innerHTML=tabs.map(t=>`<button class="button ${t===tab?'primary':'outline'}" data-tab="${t}">${esc(t.replace(/^./,c=>c.toUpperCase()))}</button>`).join('')+'<button class="button outline" id="reload">Reload saved content</button>';}
function field(k,label,value,multi=false){return `<label class="field">${esc(label)}${multi?`<textarea data-key="${k}">${esc(value)}</textarea>`:`<input data-key="${k}" value="${esc(value)}">`}</label>`;}
function render(){menu();if(tab==='subjects'){selected=Math.min(selected,draft.subjects.length-1);const s=draft.subjects[selected];$('editor').innerHTML=`<label class="field">Choose a subject<select id="record">${draft.subjects.map((r,i)=>`<option value="${i}" ${i===selected?'selected':''}>${esc(r.subject_name)} ${r.review_status==='requires_completion'?'— requires completion':''}${r.active?'':' — archived'}</option>`).join('')}</select></label><button class="button outline" id="add">+ Add subject</button><div class="admin-form" style="margin-top:22px"><h3>${esc(s.subject_name)}</h3>${field('subject_id','Subject ID (keep stable)',s.subject_id)}${field('subject_name','Subject name',s.subject_name)}${field('levels','Levels (comma separated: G1, G2, G3)',s.levels.join(', '))}${field('category','Category',s.category)}${field('short_description','Short description',s.short_description)}${field('full_description','What is this subject about?',s.full_description,true)}${field('suitable_for','This subject may suit students who… (one per line)',s.suitable_for.join('\n'),true)}${field('learning_experience','What will I do?',s.learning_experience,true)}${field('skills','Skills (one per line)',s.skills.join('\n'),true)}${field('considerations','Things to consider',s.considerations,true)}${field('source','Descriptor source',s.source)}<label class="optional-label"><input type="checkbox" id="active" ${s.active?'checked':''}>Active (uncheck to archive)</label><p class="helper">Archive only after removing this subject from active combinations.</p><button class="button primary" id="save">Save content</button></div>`;}
 else if(tab==='combinations'){ $('editor').innerHTML='<h2>Combination rules</h2><p>Edit compulsory subjects, selectable groups, ranking requirements, optional subjects and closed applications. Group choices select exactly one subject; ranked groups require every preference. Optional groups allow zero or one selection, so Computing and Music are mutually exclusive.</p>'+field('json','Combinations (JSON)',JSON.stringify(draft.combinations,null,2),true)+'<button class="button primary" id="save">Save rules</button>';$('editor').querySelector('textarea').style.minHeight='650px';}
 else if(tab==='eligibility'){$('editor').innerHTML='<h2>School eligibility wording</h2><p>These criteria are informational only. They do not block the student’s choices.</p>'+field('json','Eligibility records (JSON)',JSON.stringify(draft.eligibility,null,2),true)+'<button class="button primary" id="save">Save eligibility wording</button>';$('editor').querySelector('textarea').style.minHeight='550px';}
 else if(tab==='admins'){$('editor').innerHTML='<h2>Staff allowlist</h2><p>Use school Google accounts in the deployment owner’s Workspace domain. Editors can edit content. Only Admins can manage this list and view the log.</p>'+field('json','Staff access (JSON)',JSON.stringify(state.admins,null,2),true)+'<button class="button primary" id="save">Save staff access</button>';$('editor').querySelector('textarea').style.minHeight='350px';}
 else {$('editor').innerHTML='<h2>Change log</h2><p>Most recent 100 changes.</p><div class="table-wrap"><table><tr><th>When</th><th>Who</th><th>Type</th><th>Before / after</th></tr>'+state.log.map(r=>`<tr><td>${esc(r.timestamp)}</td><td>${esc(r.user)}</td><td>${esc(r.record_type)}</td><td><details><summary>View change</summary><pre style="max-width:500px;white-space:pre-wrap">BEFORE\n${esc(r.previous_value)}\nAFTER\n${esc(r.new_value)}</pre></details></td></tr>`).join('')+'</table></div>';}
}
function capture(){if(tab==='subjects'){const s=draft.subjects[selected];document.querySelectorAll('[data-key]').forEach(el=>{let v=el.value;if(el.dataset.key==='levels')v=v.split(',').map(s=>s.trim()).filter(Boolean);if(['skills','suitable_for'].includes(el.dataset.key))v=v.split('\n').map(s=>s.trim()).filter(Boolean);s[el.dataset.key]=v;});s.active=$('active').checked;s.review_status=s.full_description?'ready':'requires_completion';}else if(tab==='combinations'||tab==='eligibility')draft[tab]=JSON.parse(document.querySelector('[data-key="json"]').value);}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;try{if(t.dataset.tab){capture();tab=t.dataset.tab;selected=0;render();}if(t.id==='reload'){google.script.run.withSuccessHandler(loaded).withFailureHandler(fail).getAdminData();}if(t.id==='add'){capture();draft.subjects.push({subject_id:'new_'+Date.now(),subject_name:'New subject',levels:['G3'],category:'Other',short_description:'',full_description:'',suitable_for:[],learning_experience:'',skills:[],considerations:'',source:'',review_status:'requires_completion',active:true});selected=draft.subjects.length-1;render();}if(t.id==='save'){capture();$('status').textContent='Saving…';document.querySelectorAll('button').forEach(b=>b.disabled=true);const run=google.script.run.withSuccessHandler(s=>{loaded(s);$('status').textContent='Saved successfully. Students see these changes on their next page load.';}).withFailureHandler(fail);if(tab==='admins')run.saveAdmins({revision:state.revision,admins:JSON.parse(document.querySelector('[data-key="json"]').value)});else run.saveContent({revision:state.revision,request_id:crypto.randomUUID(),data:draft});}}catch(error){fail(error);}});
document.addEventListener('change',e=>{if(e.target.id==='record'){capture();selected=Number(e.target.value);render();}});
google.script.run.withSuccessHandler(loaded).withFailureHandler(fail).getAdminData();
</script></body></html>
